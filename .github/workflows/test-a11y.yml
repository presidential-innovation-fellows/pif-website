name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: a11y
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install NPM dependencies
        run: npm install

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: npm run build

      - name: Start Jekyll server in background
        run: npm run start-detached

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Jekyll server to start..."
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:4000 > /dev/null; do echo "Waiting..."; sleep 2; done'
          echo "Server is ready!"
          echo ""
          echo "Testing with multiple tools:"
          echo "1. curl status code:"
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/sitemap.xml
          echo ""
          echo "2. wget:"
          wget -q -O /dev/null http://127.0.0.1:4000/sitemap.xml && echo "wget: SUCCESS" || echo "wget: FAILED"
          echo "3. node-fetch:"
          node -e "const fetch = require('node-fetch'); fetch('http://127.0.0.1:4000/sitemap.xml', {timeout: 10000}).then(r => {console.log('node-fetch: SUCCESS, status:', r.status); return r.text();}).then(t => console.log('Size:', t.length, 'bytes')).catch(e => console.error('node-fetch: FAILED -', e.message));"

      - name: Test accessibility
        run: "npm run test-a11y"
