name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: a11y
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install NPM dependencies
        run: npm install

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: npm run build

      - name: Debug - List _site contents
        run: |
          echo "Contents of _site directory:"
          ls -la _site/ | head -30
          echo ""
          echo "Checking for sitemap.xml:"
          if [ -f "_site/sitemap.xml" ]; then
            echo "✓ sitemap.xml exists in _site/"
            echo "First 20 lines:"
            head -20 _site/sitemap.xml
          else
            echo "✗ sitemap.xml NOT found in _site/"
          fi

      - name: Start Jekyll server in background
        run: |
          echo "Starting Jekyll server..."
          npm run start-detached
          echo "Jekyll server start command completed"
          sleep 3
          echo "Checking for Jekyll logs..."
          ls -la *.log 2>/dev/null || echo "No .log files found"

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Jekyll server to start..."
          timeout 60 bash -c 'until curl -sf http://localhost:4000 > /dev/null; do echo "Waiting..."; sleep 2; done'
          echo "Server is ready!"
          
      - name: Verify sitemap exists
        run: |
          echo "Testing sitemap accessibility..."
          curl -I http://localhost:4000/sitemap.xml
          echo ""
          echo "Full sitemap content (first 30 lines):"
          curl -s http://localhost:4000/sitemap.xml | head -30
          echo "Sitemap check complete!"

      - name: Debug - Check Jekyll process
        run: |
          echo "Checking Jekyll server process:"
          ps aux | grep jekyll || true
          echo ""
          echo "Checking port 4000:"
          netstat -tuln | grep 4000 || ss -tuln | grep 4000 || true
          echo ""
          echo "Testing connection with curl:"
          curl -v http://localhost:4000/sitemap.xml 2>&1 | head -50

      - name: Debug - Test pa11y-ci with single URL
        run: |
          echo "Testing pa11y-ci with a single direct URL first:"
          npx pa11y-ci http://localhost:4000/ || echo "Direct URL test failed with exit code $?"

      - name: Test accessibility
        run: "npm run test-a11y"
