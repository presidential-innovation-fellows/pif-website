name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: a11y
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v2

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install NPM dependencies
        run: npm install

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: npm run build

      - name: Start Jekyll server in background
        run: npm run start-detached

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Jekyll server to start..."
          timeout 60 bash -c 'until curl -sf http://localhost:4000 > /dev/null; do echo "Waiting..."; sleep 2; done'
          echo "Server is ready!"
          
      - name: Verify sitemap exists
        run: |
          echo "Testing sitemap accessibility..."
          curl -I http://localhost:4000/sitemap.xml
          echo "Sitemap check complete!"

      - name: Test accessibility
        run: "npm run test-a11y"
