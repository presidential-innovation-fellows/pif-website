name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: URLs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM dependencies
        run: npm install

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build and start up jekyll server
        run: npm run build && npm run start-detached

      - name: Test for broken URLs
        # External link checking disabled until a content sweep clears
        # accumulated rot in _projects/ case studies (see PR #805 thread).
        # Internal anchor + image checks remain on.
        run: bundle exec htmlproofer --disable-external --ignore-urls "#" --ignore-files "/reports/" --ignore-missing-alt --ignore-empty-alt --swap-urls "https\://presidentialinnovationfellows.gov:" _site
